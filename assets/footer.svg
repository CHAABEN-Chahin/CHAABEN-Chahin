<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B1A78"/>
      <stop offset="0.45" stop-color="#140F2E"/>
      <stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="90" rx="16" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="mono" font-size="17" fill="#C4B5FD">
    <tspan fill="#8B5CF6">$</tspan> echo "thanks for stopping by, let's build something useful"<tspan class="caret" fill="#A78BFA"> _</tspan>
  </text>
</svg>
